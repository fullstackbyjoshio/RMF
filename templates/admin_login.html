<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — Convention 2026</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; justify-content: center; background: #121212;
            color: #fff; font-family: system-ui, -apple-system, sans-serif;
        }
        .card {
            width: 100%; max-width: 380px; padding: 32px; border-radius: 24px;
            background: linear-gradient(135deg, rgba(255,255,255,0.08) 0%, rgba(18,18,18,0.95) 100%);
            backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }
        .icon { width: 48px; height: 48px; border-radius: 50%; background: rgba(255,255,255,0.15); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; }
        h2 { text-align: center; margin: 0 0 20px; font-size: 1.5rem; font-weight: 600; }
        .err { color: #f87171; font-size: 0.85rem; background: rgba(248,113,113,0.1); padding: 8px 12px; border-radius: 10px; margin-bottom: 16px; text-align: center; }
        input { width: 100%; padding: 12px 16px; border-radius: 12px; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.1); color: #fff; font-size: 0.9rem; margin-bottom: 16px; outline: none; }
        input:focus { border-color: rgba(255,255,255,0.4); }
        button { width: 100%; padding: 12px; border-radius: 9999px; background: rgba(255,255,255,0.2); color: #fff; border: none; font-weight: 500; cursor: pointer; transition: 0.2s; }
        button:hover { background: rgba(255,255,255,0.3); }
        .footer { margin-top: 32px; color: #9ca3af; font-size: 0.8rem; text-align: center; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">
            <svg width="24" height="24.fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
        </div>
        <h2>Admin Access</h2>
        {% if error %}<div class="err">{{ error }}</div>{% endif %}
        <form method="post">
            <input type="password" name="password" placeholder="Password" required autofocus />
            <button type="submit">Sign in</button>
        </form>
    </div>
    <div class="footer">RMF Region 12 — Maiden Provincial Convention 2026</div>
</body>
</html>
